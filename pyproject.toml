[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thoughtmachine"
dynamic = ["version"]
description = "ThoughtMachine — AI agent framework"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "ThoughtMachine Contributors" },
]
requires-python = ">=3.11"

[tool.setuptools]
packages = { find = { include = ["thoughtmachine*", "agent*", "tools*", "security*", "web_ui*", "llm_providers*", "infra*"] } }

[tool.setuptools.package-data]
thoughtmachine = [
    "py.typed",
]
# Include the top-level resources directory as data files
# accessible via importlib.resources when thoughtmachine is installed.
# The empty string means "any package" — resources are top-level.
"*" = [
    "resources/.version",
    "resources/default_config.json",
    "resources/default_system_prompt.txt",
    "resources/engineer_system_prompt.txt",
    "resources/default_providers.json",
    "resources/MANIFEST.json",
    "resources/global_kb/*",
    "resources/worker_templates/*",
]

[tool.setuptools.dynamic]
version = { file = "resources/.version" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "docker: marks tests that require a real Docker daemon",
]

[project.urls]
Homepage = "https://github.com/your-org/thoughtmachine"
