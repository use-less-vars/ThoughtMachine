# contract-gate.yml - the fast gate over the invariants named in docs/CONTRACTS.md.
#
# It runs the test files cited by the ledger, enumerated by hand (no glob, no `-m`
# marker expression, never the whole suite), plus six gate-only additions the
# ledger does not cite: tests/security/test_git_hardening.py and
# web_ui/backend/tests/test_auth_boundary.py (both added by C91),
# tests/test_verify_doc_citations.py, the mutation guard for the citation checker
# wired in below, tests/test_onboarding_bundle_contract.py, whose git
# ancestry check is the only assertion in the repo that can notice the router
# pinning a commit dev no longer contains, and the two surface guards
# tests/test_host_port_kill_switch.py and
# tests/test_tool_import_declaration_match.py, which police "one spawn point"
# and "one module imports subprocess unconditionally". Those two existed and ran
# in the full-suite jobs only, so a change that broke them went green here: they
# run in this job because a new file is exactly what trips them. The parity test
# enforces cited <= run, so an uncited extra file cannot turn this workflow red.
#
# The checkout is fetch-depth: 0 (full history). That is not a luxury: the
# ancestry check has to be able to SEE the pinned commit, and a depth-1 clone
# cannot -- it would either report "not fetched" as staleness or spend the gate's
# budget deepening the clone one fetch at a time. With full history that check is
# a plain local merge-base: no network, nothing to deepen.
# Docker, secrets and the image cache of python-version-matrix.yml are
# deliberately absent: every file here is hermetic -- on the full-history
# checkout above, test_onboarding_bundle_contract.py reads the real tree and runs
# git/bash locally but fetches nothing -- so this job should finish in well under
# the 2-minute budget.
name: Contract Gate

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-gate:
    name: Contract gate (docs/CONTRACTS.md)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout -- full history, so the router's pinned commit is visible
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -e .

      - name: Contract gate (the tests docs/CONTRACTS.md cites, plus the gate-only additions)
        run: |
          set +e
          start=$(date +%s)
          python -m pytest -q -p no:cacheprovider \
            tests/test_worker_security.py \
            tests/tools/test_tool_schemas.py \
            tests/test_security_gate_disk.py \
            tests/trust/test_gate_contract.py \
            tests/test_worker_is_a_real_process.py \
            tests/test_host_port_kill_switch.py \
            tests/test_tool_import_declaration_match.py \
            tests/test_contracts_ledger_parity.py \
            tests/test_invariants_ledger_parity.py \
            tests/test_verify_doc_citations.py \
            tests/test_ceiling_value_fail_closed.py \
            tests/test_ceiling_map_completeness.py \
            tests/test_permission_hierarchy.py \
            tests/test_workspace_permissions.py \
            tests/test_gate_catalog_migration.py \
            tests/test_workspace_permission_vocab_unification.py \
            tests/test_visual_grain_closure.py \
            tests/security/test_git_hardening.py \
            tests/test_onboarding_bundle_contract.py \
            tests/test_worker_dispatch_job_registry.py \
            web_ui/backend/tests/test_auth_boundary.py
          status=$?
          end=$(date +%s)
          seconds=$((end - start))
          echo "CONTRACT_GATE_SECONDS=${seconds}" >> "$GITHUB_ENV"
          exit $status

      # The citation checker is wired over docs/CONTRACTS.md ONLY. It also parses
      # docs/design-worker-lifecycle.md, which is knowingly red today: 76 failing
      # citations (1 missing file, 20 out-of-bounds line numbers, 55 shorthand
      # references that name no file in their own section). Gating it here would
      # add a permanently failing step -- worse than no gate, because a red run
      # that nobody can fix trains readers to ignore the gate. That spec is a
      # tracked known gap, not a silent omission.
      - name: "Citation check (only docs/CONTRACTS.md; the design spec is a known gap)"
        run: python scripts/verify_doc_citations.py --doc docs/CONTRACTS.md

      - name: "Report pytest wall time (budget 120s; install time excluded)"
        if: always()
        run: |
          echo "contract-gate pytest wall time: ${CONTRACT_GATE_SECONDS:-unknown}s (budget 120s)"

  # ---------------------------------------------------------------------------
  # Mutation gate (contracts)
  #
  # This job runs scripts/mutation_gate.py, which reads the mutations declared in
  # scripts/mutation_specs.py. Three things about it are worth stating
  # plainly, because a workflow that describes its own enforcement in flattering
  # terms is worse than no workflow at all:
  #
  # 1. It mutates ONE declared guard at a time -- today exactly one,
  #    `contract-3-default-mode`, the one-token rewrite of
  #    `DEFAULT_RUNTIME_MODE = MODE_PROCESS` in tools/workspace/worker_runtime.py
  #    -- runs ONLY the tests that are supposed to notice that mutation,
  #    restores the file, and verifies the restoration by sha256 before scoring
  #    anything. It is a spot check of claims made in docs/CONTRACTS.md, not a
  #    sweep of the tree, and the number of contracts it covers is the number of
  #    entries in the registry -- nothing wider.
  # 2. A verdict of SURVIVED is a finding about the CONTRACT, not an error in the
  #    gate. It means the "test that would fail if this were removed" the ledger
  #    claims does not fail: the guard can be deleted with every named test still
  #    green. The gate exits non-zero for SURVIVED on purpose, and that is the
  #    signal this job exists to surface.
  # 3. Whether this job BLOCKS a merge is a property of the GitHub ruleset on
  #    `dev`, NOT a property of this file. This file cannot verify its own
  #    requiredness -- nothing in it can tell whether a run is advisory or
  #    blocking -- so it makes no claim about it. All this job does is make the
  #    gate RUN on every pull request; running is strictly weaker than enforcing.
  # ---------------------------------------------------------------------------
  mutation-gate:
    name: Mutation gate (contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -e .

      # No `|| true`, no continue-on-error: a gate that cannot fail is not a
      # control. The gate's own output is already the readable report --
      # `MUTATION <name>: <VERDICT>` per subject and one `GATE_SUMMARY ...` line
      # -- so nothing is parsed or re-summarised here. --timeout 300 bounds each
      # mutation's own pytest run; the job's timeout-minutes bounds the whole
      # thing, so a hung pytest cannot burn the runner.
      - name: Mutation gate (one declared guard at a time; non-zero exit is a finding)
        run: |
          set +e
          start=$(date +%s)
          python3 scripts/mutation_gate.py --timeout 300
          status=$?
          end=$(date +%s)
          seconds=$((end - start))
          echo "MUTATION_GATE_SECONDS=${seconds}" >> "$GITHUB_ENV"
          exit $status

      - name: "Report mutation gate wall time (each mutation bounded at 300s)"
        if: always()
        run: |
          echo "mutation-gate wall time: ${MUTATION_GATE_SECONDS:-unknown}s"

