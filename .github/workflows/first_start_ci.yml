#===============================================================================
# first_start_ci.yml - "first start" smoke test for the installer + launcher.
#
# Proves on a pristine Debian 13 container that:
#   (1) ./install.sh completes successfully (exit 0);
#   (2) ./start_thoughtmachine.sh --check-only passes every pre-launch check;
#   (3) ./start_thoughtmachine.sh --doctor boots the backend even when Docker
#       is unavailable, and GET /api/health/containers answers with a clean
#       "degraded" payload instead of crashing the server.
#
# DESIGN NOTES (read before changing anything here):
#   * --check-only needs a working Docker daemon for a meaningful gate. In
#     start_thoughtmachine.sh the docker check ([2/8]) treats daemon_down /
#     lib_missing as WARNING + continue in --check-only and --doctor, and as
#     FATAL in dev/prod. The job therefore runs in a debian:13 container
#     (GitHub Actions mounts the host's /var/run/docker.sock into job
#     containers) and installs the docker.io CLI: `docker info` then succeeds
#     against the host daemon, so --check-only passes.
#   * The ~/.thoughtmachine check ([6/8]) is fatal in ALL modes, so the job
#     pre-creates $HOME/.thoughtmachine before running the launcher.
#   * The final step deliberately sets DOCKER_HOST to a dead TCP endpoint.
#     The backend's Docker SDK honors DOCKER_HOST, so the health endpoint
#     deterministically reports degraded/daemon_down - this exercises the
#     "no Docker available" path a real first start can hit, and proves the
#     UI/health layer degrades gracefully instead of failing hard.
#===============================================================================
name: First-Start CI

on:
  push:
  pull_request:

concurrency:
  group: first-start-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  first-start:
    name: Install + check-only + degraded health
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      #-------------------------------------------------------------------------
      # Prerequisites. python3-venv is required by `python3 -m venv`;
      # python3-dev + build-essential cover pip sdists; nodejs (Debian 13
      # ships 20.x >= 18) satisfies the Node check; iproute2 provides `ss`,
      # util-linux provides `sg`; docker.io provides the docker CLI that
      # talks to the host socket GitHub Actions mounts into this container.
      #-------------------------------------------------------------------------
      - name: Install prerequisite packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3 python3-pip python3-venv python3-dev build-essential \
            nodejs npm curl git iproute2 util-linux docker.io

      - name: Checkout
        uses: actions/checkout@v4

      # start_thoughtmachine.sh check [6/8] (~/.thoughtmachine writable) is
      # fatal in ALL modes - even --check-only - so it must exist up front.
      - name: Pre-create $HOME/.thoughtmachine
        run: mkdir -p "$HOME/.thoughtmachine"

      # venv + Node.js are critical in install.sh and must pass; the Docker
      # steps warn+skip here by design (they are non-critical in install.sh).
      - name: Run ./install.sh
        run: bash install.sh

      # Full pre-launch gate: venv, docker (via mounted host socket + CLI),
      # ports 8000/5173, Node.js >= 18, ~/.thoughtmachine. Exits 0 only if
      # every check passes.
      - name: Run ./start_thoughtmachine.sh --check-only
        run: bash start_thoughtmachine.sh --check-only

      #-------------------------------------------------------------------------
      # Doctor mode with Docker UNAVAILABLE: DOCKER_HOST points at a dead TCP
      # endpoint, so the doctor's docker check reports daemon_down (WARNING +
      # continue in --doctor mode) and the backend's Docker SDK fails the same
      # way -> /api/health/containers must answer HTTP 200 with
      # docker.available=false and a degraded reason from the taxonomy.
      #-------------------------------------------------------------------------
      - name: Doctor mode degrades gracefully without Docker
        env:
          DOCKER_HOST: tcp://127.0.0.1:2375
        run: |
          # All the shell backgrounding/quoting/`set -e` handling this step
          # used to need lives in scripts/ci_doctor_poller.py (stdlib only):
          # it starts the --doctor wrapper as a subprocess, polls the health
          # endpoint with urllib, validates the degraded payload, prints both
          # logs and cleans up on every path. Keep this step a one-liner.
          mkdir -p logs
          # -u (unbuffered) so the poller's flush=True lines are not lost from
          # the step log when the step exits non-zero (CI runs without a tty).
          python3 -u scripts/ci_doctor_poller.py
