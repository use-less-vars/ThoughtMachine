# Platform Matrix CI - macOS jobs
# ---------------------------------------------------------------------------
# The three macOS jobs below were moved verbatim out of platform-matrix.yml.
# None of them is advisory: no job here carries `continue-on-error`, so a red
# job fails this workflow's run. They live in their own workflow so the macOS
# verdict is reported on its own run instead of colouring the run that carries
# the Linux/Windows check names. None of these three check names is in
# REQUIRED_CHECKS (scripts/apply_branch_protection.sh), so a red here is
# reported and does not block a merge -- it is no longer hidden.
#
# The trailing "(advisory)" in this file's `name:` and in the three job `name:`
# values is a stale label left in place so the check-run contexts do not change
# here; the jobs themselves are gating.
#
# The triggers, permissions and PYTHON_VERSION value are the ones
# platform-matrix.yml uses. The job bodies are the definitions removed from that
# file, unchanged in behaviour since: the only later edits are comments, one log
# string and the removal of the job-level `continue-on-error` -- no action
# versions changed, no new secrets, no new inputs, no new conditionals.
#
# Anti-vacuity is unchanged in shape: macos-suite still runs
# scripts/ci_assert_collected.py before the suite, with the same marker
# ("not docker and not e2e") and the same testpaths (tests +
# web_ui/backend/tests) as the required ubuntu-suite job in
# platform-matrix.yml.
#
# The floor is NOT the 3827 it inherited. Measured on PR #401, 2026-11-18, the
# job's own CI log printed:
#
#     ci_assert_collected: expected=3827 actual=7722
#
# i.e. the inherited figure sat 3895 collected tests below the real count, so
# a collapse would have had to swallow most of the suite before the assert
# noticed. 7722 is the same suite as the 7721 measured on Linux (Python 3.12):
# macOS runs env.PYTHON_VERSION 3.14, and collection counts differ slightly
# across versions. The floor is therefore 7600 -- the same a-couple-of-percent
# margin below the measurement that ubuntu-suite uses, for the reason spelled
# out under that job's assert step in platform-matrix.yml.
#
# A floor that is too HIGH here fails macos-suite for a reason that says
# nothing about the code: no job here is advisory (`continue-on-error` is gone),
# so that red reads as a red macOS verdict. The reverse -- too low -- is the
# failure mode worth guarding, hence the
# measurement above rather than the old number.
#
# macOS install note: install.sh supports Darwin (it runs the same prerequisite
# and venv checks as on Linux, minus the Linux-only apt / docker-group steps),
# and no macOS-specific installer exists in the repo, so the macOS install smoke
# job reports the selected installer, runs it best-effort, then falls back to a
# manual venv + pip install if the installer left no usable .venv, so the backend
# can still be started and probed.
#
# No job here is advisory: a red macOS job fails this workflow's run. The three
# check names are absent from REQUIRED_CHECKS, so that red does not block a
# merge -- but a green run now means the jobs passed.
# ---------------------------------------------------------------------------
name: Platform Matrix (macOS, advisory)

on:
  push:
    branches: [dev, master]
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  # -------------------------------------------------------------------------
  # macOS: full suite (gating: a red suite fails this workflow's run).
  # -------------------------------------------------------------------------
  macos-suite:
    name: macOS - full test suite (advisory)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -e .

      - name: Assert collected test count (anti-vacuity)
        run: >
          python scripts/ci_assert_collected.py
          --expected 7600
          --marker "not docker and not e2e"

      - name: Run test suite
        run: python -m pytest -m "not docker and not e2e" --timeout 600 -ra

  # -------------------------------------------------------------------------
  # macOS: install + startup smoke (gating: a red smoke fails this workflow's
  # run).
  #
  # Reports the host facts (uname -m / sw_vers / id -u / id -g), selects the
  # best available installer (prefer a macOS-specific script if one is added,
  # otherwise `bash install.sh`, which installs on Darwin too), then starts the
  # backend and probes the health endpoints. If the installer left no usable
  # .venv, the job falls back to a manual venv so the probes still run.
  #
  # What a green here means, step by step. The installer is allowed to fail ONLY
  # because a later step asserts its artefact:
  #   1. `Select and run installer (best effort)` MAY fail. install.sh is driven
  #      on Darwin, where its apt / docker-group branches cannot apply, and the
  #      installer is not the thing this job proves.
  #   2. `Fallback - ensure a usable environment` tests whether `.venv` is
  #      USABLE -- its interpreter imports exactly what the next step launches,
  #      `uvicorn` + `web_ui.backend.server` -- not merely present, and installs
  #      when it cannot: an interpreter that exists but cannot import is the
  #      same as no venv. That step therefore ends with a WORKING artefact or
  #      red -- which is what makes (1) defensible. Existence was never enough:
  #      a half-built venv (installer exited early) has `bin/python` and no
  #      `uvicorn`, and the health step then died on `No module named uvicorn`.
  #   3. `Start backend and probe health endpoints` must NOT fail silently: it is
  #      the only step that proves the application starts. Green there now means
  #      `/api/health` answered within the probe window, and nothing weaker; a
  #      server that dies at import is a red step with the measurement in it.
  # -------------------------------------------------------------------------
  macos-install-smoke:
    name: macOS - install/startup smoke (advisory)
    runs-on: macos-latest
    env:
      PORT: "8000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report host facts
        run: |
          echo "uname -m : $(uname -m)"
          echo "uname -s : $(uname -s)"
          echo "sw_vers  : $(sw_vers -productVersion 2>/dev/null || echo n/a)"
          echo "id -u    : $(id -u)"
          echo "id -g    : $(id -g)"

      - name: Select and run installer (best effort)
        run: |
          set -x
          if [ -f install_macos.sh ]; then
            INSTALLER="bash install_macos.sh"
          elif [ -f scripts/install_macos.sh ]; then
            INSTALLER="bash scripts/install_macos.sh"
          elif [ -f scripts/install_macos.command ]; then
            INSTALLER="bash scripts/install_macos.command"
          else
            # No macOS-specific installer exists; install.sh is the only path.
            INSTALLER="bash install.sh"
          fi
          echo "SELECTED_INSTALLER: ${INSTALLER}"
          ${INSTALLER} || echo "INSTALLER_EXIT=$? (non-fatal: the next step rebuilds the venv if this left none)"

      - name: Fallback - ensure a usable environment
        run: |
          # USABILITY, not existence: `-x .venv/bin/python` is satisfied by a
          # half-built venv whose interpreter cannot import uvicorn, so test
          # whether it imports exactly what the next step launches --
          # `uvicorn` plus `web_ui.backend.server`, its `:app` target -- and
          # repair by installing when it does not. Repair runs the same
          # commands as a fresh build, into whatever .venv exists, so it is
          # idempotent; a healthy venv costs one import and no installs.
          if .venv/bin/python -c "import uvicorn, web_ui.backend.server" 2>/dev/null; then
            echo "Using the installer's .venv: it imports uvicorn and web_ui.backend.server."
          else
            echo "No USABLE .venv (missing, or it cannot import uvicorn/web_ui.backend.server); building one."
            [ -x .venv/bin/python ] || python -m venv .venv
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/python -m pip install -r requirements.txt
            .venv/bin/python -m pip install -e .
          fi

      - name: Start backend and probe health endpoints
        # ASSERTS /api/health. /api/health/containers is informational only: its
        # availability depends on the container manager being usable on the
        # runner, and Docker presence is decided by the separate
        # macos-docker-probe job. Asserting it here would report "Docker missing"
        # as "macOS startup broken" -- a false red is the same defect as a false
        # green.
        run: |
          set -x
          .venv/bin/python -m uvicorn web_ui.backend.server:app --host 127.0.0.1 --port "${PORT}" &
          SERVER_PID=$!
          echo "SERVER_PID=${SERVER_PID}"

          ATTEMPTS=30
          INTERVAL=2
          ok=0
          for i in $(seq 1 "${ATTEMPTS}"); do
            if curl -fsS "http://127.0.0.1:${PORT}/api/health" -o /tmp/health.json; then
              ok=1
              echo "HEALTH_OK after ${i} attempt(s): $(cat /tmp/health.json)"
              break
            fi
            sleep "${INTERVAL}"
          done

          # Informational, NOT asserted (see this step's comment).
          if curl -fsS "http://127.0.0.1:${PORT}/api/health/containers" -o /tmp/health_containers.json; then
            echo "HEALTH_CONTAINERS (informational, not asserted): $(cat /tmp/health_containers.json)"
          else
            echo "HEALTH_CONTAINERS_UNREACHABLE (informational, not asserted; Docker presence is decided by macos-docker-probe)"
          fi

          # Release the port before deciding, so a failing job does not leave a
          # uvicorn holding it.
          kill "${SERVER_PID}" 2>/dev/null || true

          # The assertion. This is the LAST command in the step, and its exit
          # status is the step's: `if <false>; then ...; fi` returns 0, and the
          # failing branch ends in an explicit `exit 1`.
          if [ "${ok}" -ne 1 ]; then
            echo "FAIL: backend was launched (SERVER_PID=${SERVER_PID}) but http://127.0.0.1:${PORT}/api/health never answered" >&2
            echo "FAIL: measured ${ATTEMPTS} attempts at ${INTERVAL}s apart (up to $((ATTEMPTS * INTERVAL))s window); the process was started and is now being reported as never reachable" >&2
            exit 1
          fi

      - name: Containerized git_read status probe (only if Docker present)
        run: |
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo "Docker daemon reachable; exercising GitReadTool containerized status."
            python - <<'PY'
          import os
          try:
              from tools.git_info_tool import GitReadTool
              tool = GitReadTool(
                  operation="status",
                  session_id="ci-macos-smoke",
                  workspace_id=os.environ.get("GITHUB_WORKSPACE", "ws"),
                  session_permissions={},
              )
              text = tool.execute()
              print(text)
              print("execution_mode:", getattr(tool, "_last_execution_mode", "?"))
              print("failure_reason:", getattr(tool, "_last_failure_reason", "?"))
              print("fallback_used:", getattr(tool, "_last_fallback_used", "?"))
          except Exception as exc:  # noqa: BLE001 - the probe prints the error, not raise
              print("GIT_READ_PROBE_ERROR:", repr(exc))
          PY
          else
            echo "Docker not available on this runner; skipping git_read probe."
          fi

      - name: Shutdown / cleanup
        if: always()
        run: pkill -f "uvicorn web_ui.backend.server:app" 2>/dev/null || true

  # -------------------------------------------------------------------------
  # macOS: Docker Desktop availability probe (gating: a red probe fails this
  # workflow's run; the probe skips cleanly when Docker is absent).
  #
  # WHAT THIS PROVES (when Docker Desktop is present and the daemon is up):
  #   * the Docker CLI + daemon are reachable from the macOS runner,
  #   * `docker run --user` reports the in-container uid, and
  #   * `git status` works *inside a container against the bind-mounted
  #     workspace* (i.e. the mount is readable/writable in-container).
  #
  # WHAT THIS DOES NOT PROVE:
  #   * It does NOT prove Linux bind-mount host-ownership semantics: on macOS,
  #     Docker Desktop runs containers inside a Linux VM using a file-sharing
  #     layer (VirtioFS/gRPC-FUSE), so uid/gid mapping between the macOS host
  #     and the container is NOT the same as on a native Linux host. The
  #     in-container uid shown here is the container's uid, not the macOS
  #     host user's uid.
  # -------------------------------------------------------------------------
  macos-docker-probe:
    name: macOS - Docker availability probe (advisory)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe Docker CLI and daemon
        run: |
          set -x
          if command -v docker >/dev/null 2>&1; then
            echo "DOCKER_CLI: present ($(command -v docker))"
            docker --version || true
          else
            echo "DOCKER_CLI: absent"
          fi

          if ls -d /Applications/Docker.app* >/dev/null 2>&1; then
            echo "DOCKER_DESKTOP_APP: present"
          else
            echo "DOCKER_DESKTOP_APP: absent"
          fi

          if command -v docker >/dev/null 2>&1; then
            if docker info >/dev/null 2>&1; then
              echo "DOCKER_DAEMON: reachable"
              echo "--- branch: present + startable ---"
              docker run --rm --user "$(id -u):$(id -g)" alpine:3 sh -c 'echo in-container-id=$(id -u):$(id -g)'
            else
              echo "DOCKER_DAEMON: not reachable (branch: needs-install / not-running)"
            fi
          else
            echo "DOCKER_DAEMON: unavailable (branch: unavailable)"
          fi

      - name: git status inside container against bind-mounted workspace
        run: |
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            docker run --rm --user "$(id -u):$(id -g)" \
              -v "${GITHUB_WORKSPACE}:/workspace" -w /workspace \
              alpine:3 sh -c 'command -v git >/dev/null 2>&1 && git status --porcelain=v1 | head -n 5 || echo "git not present in probe image"'
          else
            echo "Skipping in-container git status: Docker unavailable."
          fi
